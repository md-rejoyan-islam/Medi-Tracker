name: Build all platforms

# Builds Android, Web, Windows, Linux, macOS and iOS on every push to main,
# on every tag, and on manual dispatch. Each platform's output is uploaded
# as a downloadable artifact (Actions run -> Artifacts).
#
# Additionally, pushing a tag like `v1.0.0` publishes all platform builds
# as assets on a GitHub Release (repo -> Releases).

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.41.9

jobs:
  # ---------------------------------------------------------------- Android
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # -------------------------------------------------------------------- Web
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build + BLE (BlueZ) dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libdbus-1-dev bluez
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/x64/release/bundle

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      # The runner has symlink privilege, so no Developer Mode toggle needed.
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release

  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the .app
        run: |
          cd build/macos/Build/Products/Release
          zip -r bluetooth_ble-macos.zip bluetooth_ble.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/bluetooth_ble-macos.zip

  # -------------------------------------------------------------------- iOS
  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # --no-codesign: builds without an Apple Developer account, so this
      # verifies the iOS build and produces an unsigned .app. A real
      # installable .ipa requires signing certs (see notes in BUILD.md).
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned app
        run: |
          cd build/ios/iphoneos
          zip -r Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/iphoneos/Runner-unsigned.zip

  # --------------------------------------------------------------- Release
  # Runs only for tag pushes (e.g. `git tag v1.0.0 && git push --tags`).
  # Collects every platform's build and attaches them to a GitHub Release.
  release:
    name: Publish GitHub Release
    needs: [android, web, linux, windows, macos, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          mkdir -p dist
          v="${GITHUB_REF_NAME}"
          # Android: single files, just rename for clarity.
          cp artifacts/android/app-release.apk "dist/medi-tracker-${v}-android.apk"
          cp artifacts/android/app-release.aab "dist/medi-tracker-${v}-android.aab"
          # Desktop/web outputs are folders -> zip each into one asset.
          (cd artifacts/web && zip -r "../../dist/medi-tracker-${v}-web.zip" .)
          (cd artifacts/linux && zip -r "../../dist/medi-tracker-${v}-linux.zip" .)
          (cd artifacts/windows && zip -r "../../dist/medi-tracker-${v}-windows.zip" .)
          # macOS / iOS already arrive as zips.
          cp artifacts/macos/*.zip "dist/medi-tracker-${v}-macos.zip"
          cp artifacts/ios-unsigned/*.zip "dist/medi-tracker-${v}-ios-unsigned.zip"
          ls -lh dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
